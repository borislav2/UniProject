# Harvey за Creatium Lab. Копирайте този файл в папката на Harvey (до harvey.yaml).
# harvey.local.yaml има предимство пред harvey.yaml и е в .gitignore на Harvey.
# Harvey само НАМИРА бизнеси и имейли (email.enabled: false). Писмата се пращат от
# админа на creatiumlab.com → „Потенциални клиенти“, след като внесете prospects.csv.

persona:
  name: "Борислав"
  company: "Creatium Lab"
  role: "Сайтове и маркетинг"
  email: "info@creativemoa.site"
  linkedin: ""
  tone: "директен, учтив, на „вие“, без агенционни фрази, кратко и с конкретен пример"

product:
  name: "Creatium Lab: сайт и маркетинг като една система"
  description: "Правим сайтове и маркетинг за малки бизнеси в България: бърз сайт, видимост в Google, Google Maps и AI търсачки, имейл автоматизации и техническа грижа всеки месец."
  pricing: "Стартов двигател: €450 изработка + €150/месец. Активен Маркетинг & Растеж: €850 първи месец + €400/месец. Индивидуална оферта за сложни проекти."
  key_benefits:
    - "Сайтът и маркетингът се правят заедно, от един екип, без посредници"
    - "Фиксиран бюджет и ясен обхват преди старта"
    - "Демо преглед преди пускане"
    - "Видимост в Google, Google Maps и AI асистенти"
    - "Поддръжка, сигурност и месечен отчет"
  objection_responses:
    "too expensive": "Разбирам. Започваме от стартов сайт за €450, а месечната поддръжка покрива сигурността и промените. Мога да ви изпратя безплатен преглед, за да видите какво точно има смисъл да се оправи първо."
    "already have a solution": "Чудесно. Ако искате, ще ви изпратим кратък безплатен преглед на сегашния сайт: какво работи и какво губи запитвания."
    "not interested": "Няма проблем, благодаря за отговора. Няма да ви пишем повече."
  offer:
    primary: "Сайт + маркетинг като една система (Стартов двигател или Активен Маркетинг & Растеж)"
    entry: "Безплатен преглед на сайта с няколко конкретни неща за подобряване"
    goal: "get_reply"
    booking_method: "calendar_link"
    booking_url: "https://creatiumlab.com/#konsultatsiya"
    meeting_duration: "30 минути"
    meeting_owner: "Борислав или Владимир"

icp:
  industries:
    - "restaurant"
    - "beauty salon"
    - "dentist"
    - "car repair"
    - "roofing contractor"
    - "hotel"
    - "physiotherapy"
    - "veterinary"
  company_size: "1-50 employees"
  titles:
    - "Owner"
    - "Managing Director"
    - "Собственик"
    - "Управител"
  geography:
    - "Sofia, Bulgaria"
    - "Plovdiv, Bulgaria"
    - "Varna, Bulgaria"
    - "Burgas, Bulgaria"
  hiring_signals: []
  # Център на града и радиус за търсене (като в примера на Harvey: "ширина,дължина,радиус").
  geo_coordinates:
    "Sofia, Bulgaria": "42.6977,23.3219,15"
    "Plovdiv, Bulgaria": "42.1354,24.7453,10"
    "Varna, Bulgaria": "43.2141,27.9147,10"
    "Burgas, Bulgaria": "42.5048,27.4626,10"

channels:
  email:
    enabled: false              # Harvey не праща нищо: изпращането е от админа на Creatium
    provider: "smtp"
    max_daily_sends: 0
    require_approval: true
    send_to_risky: false
    max_bounce_rate: 0.03
  linkedin:
    enabled: false              # автоматизацията нарушава правилата на LinkedIn

usage:
  max_daily_claude_percent: 40  # оставя място за вашата собствена работа с Claude
  heartbeat_interval_minutes: 30
  quiet_hours:
    start: "21:00"
    end: "08:00"
    timezone: "Europe/Sofia"
