<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Creatium Lab share image</title>
<style>
    /* Design G share image, 1200 x 630. render.mjs fills the text through the query string (?title=&accent=&lang=) and replaces __ROOT__ with the repository path. */
    @font-face { font-family: "Geologica"; font-weight: 300; src: url("__ROOT__/resources/fonts/g/geologica-cyrillic-300.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: "Geologica"; font-weight: 300; src: url("__ROOT__/resources/fonts/g/geologica-latin-300.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2013-2014, U+2018-201E, U+2022, U+2026, U+20AC, U+2212; }
    @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("__ROOT__/resources/fonts/g/jetbrains-mono-latin-500.woff2") format("woff2"); }
    :root { --bg: #ECEEF0; --ink: #0C0E12; --accent: #E8431B; --mute: #4A5058; --line: rgba(12, 14, 18, .14); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
    body { position: relative; font-family: "Geologica", sans-serif; color: var(--ink); }
    #map { position: absolute; inset: 0; width: 1200px; height: 630px; -webkit-mask-image: linear-gradient(100deg, transparent 0%, rgba(0,0,0,.35) 38%, #000 72%); mask-image: linear-gradient(100deg, transparent 0%, rgba(0,0,0,.35) 38%, #000 72%); }
    .frame { position: absolute; inset: 40px; border: 1px solid var(--line); }
    .logo { position: absolute; left: 80px; top: 76px; height: 52px; width: auto; display: block; }
    h1 { position: absolute; left: 80px; top: 230px; width: 860px; font-weight: 300; font-size: 78px; line-height: 1.08; letter-spacing: -.025em; }
    h1 em { font-style: normal; color: var(--accent); }
    html[lang="en"] h1 { width: 1000px; }
    .foot { position: absolute; left: 80px; right: 80px; bottom: 76px; display: flex; align-items: center; gap: 20px; font: 500 22px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
    .foot i { flex: none; width: 10px; height: 10px; background: var(--accent); }
</style>
</head>
<body>
<svg id="map" viewBox="0 0 1200 630" aria-hidden="true"></svg>
<div class="frame"></div>
<img class="logo" src="__ROOT__/public/images/logo-g.png" alt="Creatium Lab">
<h1 id="title"></h1>
<div class="foot"><i></i>creatiumlab.com</div>
<script>
    const q = new URLSearchParams(location.search);
    const title = q.get('title') || '';
    const accent = (q.get('accent') || '').split('|').filter(Boolean);
    let html = title.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    accent.forEach((w) => { html = html.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')'), '<em>$1</em>'); });
    document.getElementById('title').innerHTML = html;
    document.documentElement.lang = q.get('lang') || 'bg';

    // The contour motif of the home hero (the same noise field, frozen at one moment), drawn with marching squares as SVG paths.
    const W = 1200, H = 630, CELL = 10, t = 3.2, k = 0.05;
    const nx = Math.ceil(W / CELL) + 1, ny = Math.ceil(H / CELL) + 1;
    const field = new Float32Array(nx * ny);
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const u = (i + 20) * k, v = (j + 6) * k;
        field[j * nx + i] = 0.55 * Math.sin(u * 1.3 + t * 0.35 + 1.7 * Math.sin(v * 0.7 - t * 0.2))
            + 0.45 * Math.cos(v * 1.1 - t * 0.28 + 0.8 * Math.sin(u * 0.9 + t * 0.15))
            + 0.5 * Math.sin((u + v) * 0.6 + t * 0.1);
    }
    const SEG = { 1: [[3, 2]], 2: [[2, 1]], 3: [[3, 1]], 4: [[0, 1]], 5: [[3, 0], [1, 2]], 6: [[0, 2]], 7: [[3, 0]], 8: [[3, 0]], 9: [[0, 2]], 10: [[0, 1], [2, 3]], 11: [[0, 1]], 12: [[3, 1]], 13: [[2, 1]], 14: [[3, 2]] };
    const svg = document.getElementById('map');
    const NS = 'http://www.w3.org/2000/svg';
    for (let li = 0, L = -1.36; li <= 16; li++, L += 0.17) {
        let d = '';
        for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
            const a = field[j * nx + i], b = field[j * nx + i + 1], c = field[(j + 1) * nx + i + 1], dd = field[(j + 1) * nx + i];
            const m = (a > L ? 8 : 0) | (b > L ? 4 : 0) | (c > L ? 2 : 0) | (dd > L ? 1 : 0);
            if (m === 0 || m === 15) continue;
            const x0 = i * CELL, y0 = j * CELL;
            for (const [e0, e1] of SEG[m]) {
                const p = [];
                for (const e of [e0, e1]) {
                    let x, y, s;
                    if (e === 0) { s = (L - a) / (b - a); x = x0 + s * CELL; y = y0; }
                    else if (e === 1) { s = (L - b) / (c - b); x = x0 + CELL; y = y0 + s * CELL; }
                    else if (e === 2) { s = (L - dd) / (c - dd); x = x0 + s * CELL; y = y0 + CELL; }
                    else { s = (L - a) / (dd - a); x = x0; y = y0 + s * CELL; }
                    p.push(x.toFixed(1), y.toFixed(1));
                }
                d += 'M' + p[0] + ' ' + p[1] + 'L' + p[2] + ' ' + p[3];
            }
        }
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', li === 5 ? '#E8431B' : '#0C0E12');
        path.setAttribute('stroke-opacity', li === 5 ? '.95' : (li % 4 === 0 ? '.5' : '.26'));
        path.setAttribute('stroke-width', li === 5 ? '2' : (li % 4 === 0 ? '1.2' : '0.9'));
        path.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(path);
    }
</script>
</body>
</html>
