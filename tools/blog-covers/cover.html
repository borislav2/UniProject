<!doctype html>
<!-- Корици на статиите в блога (public/images/blog/{slug}.webp). Рисува се от render.mjs: cover.html?slug=... -->
<html lang="bg">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Manrope; font-weight: 200 800; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-cyrillic-wght-normal.woff2') format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: Manrope; font-weight: 200 800; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 675px; overflow: hidden; font-family: Manrope, sans-serif; color: #0f1a2b; }
.stage { position: relative; width: 1200px; height: 675px; overflow: hidden;
  background: radial-gradient(900px 520px at 78% 18%, rgba(59,119,189,.55), transparent 60%),
              radial-gradient(700px 480px at 8% 100%, rgba(45,99,163,.45), transparent 60%),
              linear-gradient(135deg, #0b1422 0%, #0f1a2b 45%, #1a3255 100%); }
.stage::before { content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 48px 48px; mask-image: radial-gradient(ellipse at 60% 45%, #000 30%, transparent 78%); }
.glow { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
.abs { position: absolute; }
.card { position: absolute; background: #fff; border-radius: 22px; box-shadow: 0 40px 80px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); overflow: hidden; }
.glass { position: absolute; border-radius: 18px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(12px); color: #fff; box-shadow: 0 20px 40px -18px rgba(0,0,0,.6); }
.chip { position: absolute; display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 16px; background: #fff; font-weight: 700; font-size: 20px; box-shadow: 0 24px 48px -16px rgba(0,0,0,.55); white-space: nowrap; }
.chip.dark { background: #0f1a2b; color: #fff; border: 1px solid rgba(255,255,255,.15); }
.ic { display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; flex-shrink: 0; }
svg { fill: currentColor; }
.tile { width: 44px; height: 44px; background: linear-gradient(135deg, #2d63a3, #0f1a2b); color: #fff; }
.tile.green { background: linear-gradient(135deg, #16a34a, #0f5132); }
.tile.red { background: linear-gradient(135deg, #dc2626, #7f1d1d); }
.tile.amber { background: linear-gradient(135deg, #f59e0b, #b45309); }
.bar { height: 14px; border-radius: 7px; background: #e5e9f0; }
.bar.b { background: #cdddf0; }
.bar.d { background: #0f1a2b; }
.muted { color: #64748b; }
.chrome { height: 46px; background: #f1f4f8; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #e2e8f0; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #cbd5e1; }
.url { margin-left: 14px; flex: 1; height: 28px; border-radius: 14px; background: #fff; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 15px; color: #334155; font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; background: #0f1a2b; color: #fff; font-weight: 700; font-size: 17px; }
.phone { position: absolute; width: 270px; height: 540px; border-radius: 44px; background: #0b1422; padding: 12px; box-shadow: 0 40px 80px -20px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.12); }
.phone .screen { width: 100%; height: 100%; border-radius: 34px; background: #fff; overflow: hidden; position: relative; }
.notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 90px; height: 24px; border-radius: 12px; background: #0b1422; z-index: 2; }
.stars { display: inline-flex; gap: 3px; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; }
h3 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.row { display: flex; align-items: center; gap: 12px; }
.check { width: 26px; height: 26px; border-radius: 50%; background: #dcfce7; color: #16a34a; }
.cross { width: 26px; height: 26px; border-radius: 50%; background: #fee2e2; color: #dc2626; }
.mono { font-family: 'DejaVu Sans Mono', monospace; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
fetch('icons.json').then(r => r.json()).then(ICONS => {
const icon = (name, size = 22) => { const [w, h, d] = ICONS[name]; return `<svg width="${size}" height="${size}" viewBox="0 0 ${w} ${h}"><path d="${d}"/></svg>`; };
const tile = (name, cls = '', size = 44, isz = 20) => `<span class="ic tile ${cls}" style="width:${size}px;height:${size}px">${icon(name, isz)}</span>`;
const star = (fill = '#f59e0b', s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${fill}" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>`;
const stars = (n = 5, s = 22) => `<span class="stars">${Array.from({length: 5}, (_, i) => star(i < n ? '#f59e0b' : '#d6dbe3', s)).join('')}</span>`;
const bars = (ws, cls = '', gap = 12, h = 14) => ws.map(w => `<div class="bar ${cls}" style="width:${w}%;height:${h}px;margin-bottom:${gap}px"></div>`).join('');
const chk = (ok = true) => `<span class="ic ${ok ? 'check' : 'cross'}">${icon(ok ? 'check' : 'minus', 13)}</span>`;
const chip = (x, y, html, cls = '', rot = 0) => `<div class="chip ${cls}" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg)">${html}</div>`;
const glow = (x, y, s, c) => `<div class="glow" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${c}"></div>`;
const browser = (x, y, w, h, url, inner, rot = 0) => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)"><div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="url">${url}</div></div>${inner}</div>`;
const phone = (x, y, inner, rot = 0) => `<div class="phone" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg)"><div class="screen"><div class="notch"></div>${inner}</div></div>`;
const lock = `<span style="color:#16a34a;display:inline-flex">${icon('lock', 13)}</span>`;
const siteHero = (title, sub, btn = 'Изпратете запитване') => `<div style="padding:34px 40px"><div class="row" style="justify-content:space-between;margin-bottom:34px"><div class="row" style="gap:10px"><span class="ic tile" style="width:34px;height:34px;border-radius:10px">${icon('hammer', 16)}</span><b style="font-size:18px">Здрав покрив</b></div><div class="row" style="gap:22px;font-size:15px;font-weight:600;color:#475569"><span>Услуги</span><span>Цени</span><span>Контакти</span></div></div><div style="font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;max-width:520px">${title}</div><div class="muted" style="font-size:18px;margin:14px 0 24px;max-width:500px">${sub}</div><div class="row"><span class="btn">${btn} ${icon('arrow-right', 14)}</span><span class="btn" style="background:#fff;color:#0f1a2b;border:1px solid #e2e8f0">${icon('phone', 14)} 0888 12 34 56</span></div></div>`;
const mapBg = `<svg width="100%" height="100%" style="position:absolute;inset:0"><rect width="100%" height="100%" fill="#e8eef5"/><g stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round"><path d="M-20 120 C 200 160 320 60 640 140"/><path d="M120 -20 C 160 160 90 300 180 480"/><path d="M-20 330 C 180 300 420 380 640 320"/><path d="M420 -20 C 380 140 470 280 430 480"/></g><g fill="#d3ecd9"><rect x="230" y="190" width="120" height="80" rx="14"/><rect x="480" y="40" width="90" height="60" rx="14"/></g><g fill="#c9dcf0"><path d="M0 420 C 120 400 260 470 420 440 L 640 470 L 640 520 L 0 520z"/></g></svg>`;
const pin = (x, y, c = '#dc2626', s = 46) => `<div class="abs" style="left:${x}px;top:${y}px;color:${c};filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))">${icon('location-dot', s)}</div>`;
const emailCard = (x, y, w, from, subject, lines, rot = 0, extra = '') => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;padding:28px 30px;transform:rotate(${rot}deg)"><div class="row" style="margin-bottom:16px"><span class="ic tile" style="width:42px;height:42px;border-radius:50%">${icon('envelope', 18)}</span><div><b style="font-size:17px">${from}</b><div class="muted" style="font-size:14px">до мен</div></div></div><div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:16px">${subject}</div>${bars(lines)}${extra}</div>`;
const chat = (x, y, w, q, a) => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;padding:26px"><div class="row" style="justify-content:flex-end;margin-bottom:18px"><div style="background:#0f1a2b;color:#fff;padding:14px 18px;border-radius:18px 18px 4px 18px;font-size:17px;font-weight:600;max-width:80%">${q}</div></div><div class="row" style="align-items:flex-start"><span class="ic tile" style="width:40px;height:40px;border-radius:50%">${icon('robot', 18)}</span><div style="background:#f1f5f9;padding:16px 18px;border-radius:18px 18px 18px 4px;font-size:16px;flex:1">${a}</div></div></div>`;
const serp = (url, title, desc, hl = false) => `<div style="padding:14px 0;${hl ? 'background:#eff6ff;margin:0 -16px;padding:14px 16px;border-radius:14px;box-shadow:inset 0 0 0 2px #3b77bd' : ''}"><div class="muted" style="font-size:14px;margin-bottom:4px">${url}</div><div style="color:#1a0dab;font-size:21px;font-weight:600;margin-bottom:6px">${title}</div><div style="font-size:15px;color:#475569;line-height:1.45">${desc}</div></div>`;

const scenes = {
  'kakvo-tryabva-da-ima-saytat-na-malak-biznes': () => glow(700, -80, 380, '#3b77bd') +
    browser(110, 95, 720, 470, `${lock} zdravpokriv.bg`, siteHero('Ремонт на покриви в Пловдив и областта', 'Оглед до 48 часа и писмена оферта с цените на материалите.') + `<div class="row" style="gap:16px;padding:0 40px">${['Покриви', 'Улуци', 'Хидроизолация'].map(t => `<div style="flex:1;border:1px solid #e2e8f0;border-radius:14px;padding:16px"><b style="font-size:16px">${t}</b><div class="muted" style="font-size:14px;margin-top:4px">от 25 €/кв. м</div></div>`).join('')}</div>`) +
    `<div class="card" style="left:780px;top:150px;width:330px;padding:26px"><h3 style="margin-bottom:16px">6 задължителни неща</h3>${['Какво и къде', 'Телефон с един клик', 'Услуги и цени', 'Снимки и отзиви', 'Кратка форма', 'Работи на телефон'].map(t => `<div class="row" style="margin-bottom:12px;font-size:17px;font-weight:600">${chk()} ${t}</div>`).join('')}</div>`,

  'profil-v-google-business-kak-da-go-popalnite': () => glow(80, 300, 400, '#2d63a3') +
    `<div class="card" style="left:120px;top:90px;width:560px;height:500px">${mapBg}${pin(250, 170, '#dc2626', 56)}${pin(110, 300, '#64748b', 38)}${pin(420, 260, '#64748b', 38)}${pin(500, 90, '#64748b', 38)}</div>` +
    `<div class="card" style="left:600px;top:130px;width:470px;padding:28px"><div class="row" style="margin-bottom:6px"><span class="ic tile" style="width:52px;height:52px;border-radius:14px">${icon('car', 24)}</span><div><div style="font-size:24px;font-weight:800">Авто Север</div><div class="row" style="gap:8px;font-size:16px"><b>4,9</b> ${stars(5, 18)} <span class="muted">(87)</span></div></div></div><div class="muted" style="font-size:16px;margin:10px 0 18px">Автосервиз · кв. Меден рудник, Бургас</div><div class="row" style="gap:10px;margin-bottom:20px">${[['phone', 'Обаждане'], ['map-location-dot', 'Маршрут'], ['globe', 'Уебсайт']].map(([i, t]) => `<span style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:14px;background:#eff6ff;color:#274f84;font-weight:700;font-size:14px">${icon(i, 18)}${t}</span>`).join('')}</div>${[['Отворено', 'до 18:00'], ['Телефон', '0888 12 34 56'], ['Категория', 'Автосервиз']].map(([a, b]) => `<div class="row" style="justify-content:space-between;padding:10px 0;border-top:1px solid #eef2f6;font-size:16px"><span class="muted">${a}</span><b style="${a === 'Отворено' ? 'color:#16a34a' : ''}">${b}</b></div>`).join('')}</div>`,

  'kak-da-izberete-domeyn-za-biznesa-si': () => glow(500, 120, 420, '#3b77bd') +
    `<div class="card" style="left:150px;top:150px;width:900px;padding:26px 30px"><div class="row" style="gap:14px"><span style="color:#64748b">${icon('globe', 26)}</span><div style="flex:1;font-size:42px;font-weight:800;letter-spacing:-.03em">zdravpokriv<span style="color:#2d63a3">.bg</span></div><span class="badge" style="background:#dcfce7;color:#15803d;font-size:18px;padding:8px 16px">${icon('check', 14)} Свободен</span></div></div>` +
    `<div class="row abs" style="left:150px;top:300px;gap:20px">${[['zdravpokriv.com', 'Пренасочва към .bg', true], ['zdrav-pokriv-bg-ltd.com', 'Труден за диктуване', false], ['здравпокрив.бг', 'Трудно се пише', false]].map(([d, t, ok]) => `<div class="card" style="position:relative;width:286px;padding:22px"><div class="row" style="margin-bottom:10px">${chk(ok)}<b style="font-size:18px">${d}</b></div><div class="muted" style="font-size:16px">${t}</div></div>`).join('')}</div>` +
    chip(150, 470, `${tile('file-contract', '', 40, 18)} Собственик: вашата фирма`, '') + chip(560, 470, `${tile('rotate-left', 'green', 40, 18)} Автоматично подновяване`, ''),

  'meta-zaglavie-i-opisanie': () => glow(-60, 60, 420, '#3b77bd') +
    `<div class="card" style="left:150px;top:80px;width:900px;padding:30px 40px"><div class="row" style="gap:14px;margin-bottom:12px;padding:12px 20px;border-radius:999px;border:1px solid #dfe3ea;width:520px"><span class="muted">${icon('magnifying-glass', 18)}</span><span style="font-size:19px">ремонт на покриви пловдив</span></div>${serp('zdravpokriv.bg › uslugi', 'Ремонт на покриви в Пловдив | Здрав покрив', 'Оглед и писмена оферта до 48 часа. Работим в Пловдив и областта. Изпратете снимка на покрива и ще ви се обадим.', true)}${serp('primer-firma.bg', 'Начало | Пример ЕООД', 'Добре дошли на сайта на нашата фирма. Ние сме лидер в бранша с дългогодишен опит и предлагаме качествени…')}</div>` +
    chip(840, 150, `<span class="badge" style="background:#dcfce7;color:#15803d">58 знака</span> Заглавие`, '', 3) + chip(860, 250, `<span class="badge" style="background:#dcfce7;color:#15803d">142 знака</span> Описание`, '', -2),

  'kolko-barzo-tryabva-da-se-zarezhda-saytat': () => glow(650, 80, 420, '#16a34a') +
    phone(170, 70, `<div style="padding:52px 22px 0">${bars([60], 'd', 18, 18)}${bars([92, 80, 70], '', 10, 10)}<div style="height:150px;border-radius:16px;background:linear-gradient(135deg,#cdddf0,#e8eef5);margin:14px 0"></div>${bars([88, 74, 90, 60], '', 10, 10)}<span class="btn" style="margin-top:8px;font-size:14px;padding:10px 16px">Запитване</span></div>`, -4) +
    `<div class="card" style="left:540px;top:110px;width:520px;padding:34px"><div class="row" style="gap:30px;margin-bottom:26px"><svg width="150" height="150" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="#f0fdf4" stroke="#dcfce7" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-dasharray="${0.97 * 314} 314" transform="rotate(-90 60 60)"/><text x="60" y="72" text-anchor="middle" font-size="36" font-weight="800" fill="#15803d" font-family="Manrope">97</text></svg><div><div style="font-size:26px;font-weight:800">Производителност</div><div class="muted" style="font-size:17px;margin-top:6px">Мобилен телефон</div></div></div>${[['LCP', '1,8 s'], ['INP', '120 ms'], ['CLS', '0,02']].map(([a, b]) => `<div class="row" style="justify-content:space-between;padding:12px 0;border-top:1px solid #eef2f6;font-size:18px"><span class="row" style="gap:10px"><span style="width:12px;height:12px;border-radius:50%;background:#16a34a"></span><b>${a}</b></span><b class="mono" style="color:#15803d">${b}</b></div>`).join('')}</div>` +
    chip(470, 520, `${tile('image', 'amber', 40, 18)} Снимка: 4,8 MB → 160 KB`, ''),

  'kakvo-e-geo': () => glow(720, 60, 420, '#3b77bd') +
    chat(120, 110, 620, 'Търся детски зъболекар във Варна, който работи в събота.', `<b>Ето няколко варианта:</b>${[['Дент Плюс', 'детска стоматология, събота 9–14 ч.'], ['Усмивка', 'кабинет в Чайка, събота по уговорка']].map(([a, b]) => `<div style="margin-top:10px;padding:12px 14px;background:#fff;border-radius:12px;border:1px solid #e2e8f0"><b>${a}</b> <span class="muted">· ${b}</span></div>`).join('')}<div class="muted" style="font-size:14px;margin-top:10px">Източници: dentplus.bg · Google Карти</div>`) +
    `<div class="card" style="left:780px;top:150px;width:310px;padding:24px"><h3 style="margin-bottom:14px">Откъде знае</h3>${[['globe', 'Вашият сайт'], ['location-dot', 'Google профил'], ['quote-left', 'Отзиви'], ['newspaper', 'Каталози и статии']].map(([i, t]) => `<div class="row" style="margin-bottom:12px;font-size:17px;font-weight:600">${tile(i, '', 36, 15)} ${t}</div>`).join('')}</div>` +
    chip(800, 470, `${tile('code', '', 40, 18)} schema.org`, 'dark'),

  'zashto-da-sabirate-imeyli-ot-klientite-si': () => glow(100, 280, 420, '#2d63a3') +
    `<div class="card" style="left:130px;top:110px;width:480px;padding:32px"><h3 style="margin-bottom:6px">Напомняне за профилактика</h3><div class="muted" style="font-size:16px;margin-bottom:22px">Ще ви пишем, когато стане време за следващия преглед.</div><div style="border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;font-size:17px;color:#64748b;margin-bottom:14px">maria@abv.bg</div><div class="row" style="font-size:15px;margin-bottom:20px;align-items:flex-start"><span class="ic" style="width:22px;height:22px;border-radius:6px;background:#2d63a3;color:#fff">${icon('check', 12)}</span><span>Искам да получавам напомняния по имейл. Около едно писмо на месец.</span></div><span class="btn" style="width:100%;justify-content:center">Запишете ме</span></div>` +
    `<div class="card" style="left:660px;top:150px;width:420px;padding:24px"><div class="row" style="justify-content:space-between;margin-bottom:14px"><h3>Абонати</h3><span class="badge" style="background:#eff6ff;color:#274f84">ваш списък</span></div>${['Мария П.', 'Иван Г.', 'Елена Д.', 'Петър С.'].map(n => `<div class="row" style="padding:10px 0;border-top:1px solid #eef2f6;font-size:17px"><span class="ic" style="width:34px;height:34px;border-radius:50%;background:#eff6ff;color:#274f84">${icon('user-gear', 14)}</span><b style="flex:1">${n}</b>${chk()}</div>`).join('')}</div>` +
    chip(700, 500, `${tile('shield-halved', 'green', 40, 18)} Съгласие по GDPR`, ''),

  'https-i-katinarcheto': () => glow(560, 160, 400, '#16a34a') +
    `<div class="card" style="left:150px;top:120px;width:900px;padding:26px 30px"><div class="row" style="gap:16px"><span class="ic" style="width:56px;height:56px;border-radius:16px;background:#dcfce7;color:#16a34a">${icon('lock', 26)}</span><div style="font-size:34px;font-weight:700;letter-spacing:-.02em"><span style="color:#16a34a">https://</span>zdravpokriv.bg</div></div></div>` +
    `<div class="card" style="left:150px;top:270px;width:900px;padding:26px 30px;opacity:.92"><div class="row" style="gap:16px"><span class="ic" style="width:56px;height:56px;border-radius:16px;background:#fee2e2;color:#dc2626">${icon('triangle-exclamation', 24)}</span><div style="font-size:30px;font-weight:700;color:#94a3b8;letter-spacing:-.02em"><span style="color:#dc2626">Не е защитено</span> · http://primer-firma.bg</div></div></div>` +

    `<div class="abs" style="left:690px;top:120px;display:flex;flex-direction:column;gap:16px;width:390px">${[['1 брой', '24 €', ''], ['2 броя + подарък', '44 €', 'Най-продавано'], ['3 броя + безплатна доставка', '62 €', '']].map(([a, b, c]) => `<div class="card" style="position:relative;padding:20px 22px;${c ? 'box-shadow:0 0 0 3px #3b77bd,0 30px 60px -20px rgba(0,0,0,.6)' : ''}"><div class="row" style="justify-content:space-between"><b style="font-size:18px">${a}</b><b style="font-size:20px">${b}</b></div>${c ? `<span class="badge" style="background:#3b77bd;color:#fff;margin-top:8px">${c}</span>` : ''}</div>`).join('')}</div>` +
    chip(700, 520, `${tile('chart-line', 'green', 40, 18)} Средна поръчка: 60 € → 85 €`, ''),
};

const slug = new URLSearchParams(location.search).get('slug');
const stage = document.getElementById('stage');
stage.innerHTML = '<div id="scene" style="position:absolute;inset:0">' + (scenes[slug] ? scenes[slug]() : '<h1 style="color:#fff;padding:40px">Няма сцена: ' + slug + '</h1>') + '</div>';
window.SLUGS = Object.keys(scenes);
document.fonts.ready.then(() => {
  // Центрира композицията (без размитите светлини), за да има еднакво поле от всички страни.
  const scene = document.getElementById('scene');
  const boxes = [...scene.children].filter(el => !el.classList.contains('glow')).map(el => el.getBoundingClientRect());
  if (boxes.length) {
    const left = Math.min(...boxes.map(b => b.left)), right = Math.max(...boxes.map(b => b.right));
    const top = Math.min(...boxes.map(b => b.top)), bottom = Math.max(...boxes.map(b => b.bottom));
    scene.style.transform = `translate(${Math.round(600 - (left + right) / 2)}px, ${Math.round(337 - (top + bottom) / 2)}px)`;
  }
  document.body.dataset.ready = '1';
});
});
</script>
