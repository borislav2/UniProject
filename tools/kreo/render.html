<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Geologica; font-weight: 300 500; src: url(/resources/fonts/g/geologica-cyrillic-300.woff2); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: Geologica; font-weight: 300 500; src: url(/resources/fonts/g/geologica-latin-300.woff2); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2212; }
@font-face { font-family: "JetBrains Mono"; font-weight: 400 500; src: url(/resources/fonts/g/jetbrains-mono-cyrillic-500.woff2); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "JetBrains Mono"; font-weight: 400 500; src: url(/resources/fonts/g/jetbrains-mono-latin-500.woff2); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2212; }
html, body { margin: 0; background: transparent; }
canvas { display: block; }
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/examples/jsm/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Renders one still of the Kreo scenes (the same modules the site uses). Driven by tools/kreo/render.mjs through window.shot().
import { createStory } from '/resources/js/kreo/story.js';
import { createTeam } from '/resources/js/kreo/team.js';

const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'story';
const w = Number(q.get('w') || 960);
const h = Number(q.get('h') || 720);
const dark = q.get('dark') === '1';
const data = JSON.parse(q.get('data') || '{}');
const canvas = document.getElementById('c');
canvas.width = w; canvas.height = h;
canvas.style.width = w + 'px'; canvas.style.height = h + 'px';

await Promise.all([
    document.fonts.load('300 46px Geologica', (data.titles || []).join(' ') + (data.labels || []).join(' ')),
    document.fonts.load('500 28px "JetBrains Mono"', '0123456789'),
]);

let api;
if (kind === 'team') {
    api = createTeam({ canvas, width: w, height: h, pixelRatio: 1, dark, labels: data.labels || [] });
    window.draw = () => { api.update(); api.render(); };
} else {
    api = createStory({ canvas, width: w, height: h, pixelRatio: 1, dark, planTitles: data.titles || [], siteImage: data.site || '' });
    await api.ready;
    window.draw = (t) => { api.update(t, 0, 0, 0, false); api.render(); };
}
// the PNG is exported straight after the draw (webp with alpha, quality chosen by the caller)
window.exportImage = (t, quality) => { window.draw(t); return canvas.toDataURL('image/webp', quality); };
window.ready = true;
</script>
</body>
</html>
