# Заглавки за сигурност за всички отговори (страници и статични файлове).
# Nginx не наследява add_header в location, който има свой add_header, затова този файл
# се включва и на ниво сървър, и във всеки такъв location (/build/, картинки).
# Инсталира се като /etc/nginx/creatium-security.conf от deploy/update-nginx.sh.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Не ограничава скриптовете (GTM зарежда таговете на маркетинга от различни домейни),
# а само забранява вграждане от други сайтове, <base>/<object> инжекции и форми към чужди адреси.
add_header Content-Security-Policy "upgrade-insecure-requests; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
