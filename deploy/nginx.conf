# Инсталира се като /etc/nginx/conf.d/creatiumlab.conf от almalinux-setup.sh.
# HTTPS блокът и пренасочването HTTP -> HTTPS се добавят автоматично от `certbot --nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    root __APP_DIR__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;

    include /etc/nginx/creatium-security.conf;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    include /etc/nginx/creatium-static.conf;

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/creatium-security.conf;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
