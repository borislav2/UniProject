# Дълъг кеш за статичните файлове извън /build (лого, favicon, картинки).
# Включва се в сървърния блок на сайта от deploy/update-nginx.sh.
location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    include /etc/nginx/creatium-security.conf;
    access_log off;
    try_files $uri =404;
}
